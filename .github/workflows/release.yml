name: Release Module

# Runs whenever you push a tag like "v1.0.1".
# It rewrites the "download" URL in module.json to point at this specific
# release's zip, zips the module, and publishes both files as release assets.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set the download URL for this release
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg url "https://github.com/${REPO}/releases/download/${TAG}/module.zip" \
             '.download = $url' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Zip the module
        run: zip -r module.zip module.json scripts README.md

      - name: Publish release with module.json and module.zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
